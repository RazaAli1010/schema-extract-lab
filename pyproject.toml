[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schema-extract-lab"
version = "0.1.0"
description = "Fine-tune a ~1.7B model to extract a strict JSON schema from job postings."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pydantic==2.13.4",
  "jsonschema==4.26.0",
  "openai==2.51.0",
  "typer==0.27.0",
  "python-dotenv>=1.0",
  "datasets==5.0.1",      # base, not gpu: F1 streams the corpus on the laptop.
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.0"]
gpu = [                      # NEVER installed on the laptop
  "torch==2.13.0",
  "transformers==5.14.1",
  "trl==1.5.1",
  "peft==0.20.0",
  "accelerate==1.14.0",
  "bitsandbytes==0.50.0",
  "outlines==1.3.2",
]

[project.scripts]
sxl = "sxl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sxl"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# SPEC §9.2 mandates this test body verbatim. Keep it byte-identical to the spec
# rather than "improving" it with an explicit check=False.
"tests/test_no_torch_import.py" = ["PLW1510"]

[tool.pytest.ini_options]
testpaths = ["tests"]
